<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAU Liquidity - Bitácora Interactiva</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #d4af37;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: var(--accent);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .metric-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .metric-card span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .metric-card strong {
            font-size: 1rem;
            color: var(--accent);
        }
        .form-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .row {
            display: flex;
            gap: 8px;
        }
        .row .form-group {
            flex: 1;
        }
        button.btn-submit {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 5px;
        }
        .history-section h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .trade-item {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
            font-size: 0.85rem;
        }
        .trade-item.win { border-left-color: var(--success); }
        .trade-item.loss { border-left-color: var(--danger); }
        .trade-info b { display: block; font-size: 0.9rem; }
        .trade-result { font-weight: bold; }
        .trade-result.win { color: var(--success); }
        .trade-result.loss { color: var(--danger); }
    </style>
</head>
<body>
    <div class="container">
        <h2>XAU LIQUIDITY - BITÁCORA</h2>

        <!-- Resumen de Métricas -->
        <div class="metrics-grid">
            <div class="metric-card">
                <span>Winrate</span>
                <strong id="stat-winrate">0%</strong>
            </div>
            <div class="metric-card">
                <span>Neto ($)</span>
                <strong id="stat-net">$0.00</strong>
            </div>
            <div class="metric-card">
                <span>Trades</span>
                <strong id="stat-total">0</strong>
            </div>
        </div>

        <!-- Formulario para Registrar Operación -->
        <div class="form-card">
            <form id="trade-form">
                <div class="row">
                    <div class="form-group">
                        <label>Activo</label>
                        <select id="asset">
                            <option value="XAUUSD">XAUUSD</option>
                            <option value="US30">US30</option>
                            <option value="Crypto">Crypto</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Resultado</label>
                        <select id="result-type">
                            <option value="WIN">🟢 WIN (+)</option>
                            <option value="LOSS">🔴 LOSS (-)</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Entrada</label>
                        <input type="number" step="any" id="entry-price" placeholder="Ej: 2320.50" required>
                    </div>
                    <div class="form-group">
                        <label>Monto / PnL ($)</label>
                        <input type="number" step="any" id="pnl-amount" placeholder="Ej: 150 o -50" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Registrar Operación</button>
            </form>
        </div>

        <!-- Historial de Trades -->
        <div class="history-section">
            <h3>Historial de Sesión</h3>
            <div id="trades-list">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">No hay operaciones registradas hoy.</div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let trades = [];

        const form = document.getElementById('trade-form');
        const tradesList = document.getElementById('trades-list');
        const statWinrate = document.getElementById('stat-winrate');
        const statNet = document.getElementById('stat-net');
        const statTotal = document.getElementById('stat-total');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const asset = document.getElementById('asset').value;
            const type = document.getElementById('result-type').value;
            const entry = document.getElementById('entry-price').value;
            const pnl = parseFloat(document.getElementById('pnl-amount').value);

            const trade = {
                asset,
                type,
                entry,
                pnl
            };

            trades.unshift(trade);
            updateUI();
            form.reset();
        });

        function updateUI() {
            tradesList.innerHTML = '';
            if (trades.length === 0) {
                tradesList.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">No hay operaciones registradas hoy.</div>';
                statWinrate.innerText = '0%';
                statNet.innerText = '$0.00';
                statTotal.innerText = '0';
                return;
            }

            let wins = 0;
            let totalNet = 0;

            trades.forEach(t => {
                if (t.type === 'WIN') wins++;
                totalNet += t.pnl;

                const item = document.createElement('div');
                item.className = `trade-item ${t.type.toLowerCase()}`;
                item.innerHTML = `
                    <div class="trade-info">
                        <b>${t.asset} @ ${t.entry}</b>
                        <span style="color: var(--text-muted);">Ref: ${t.type}</span>
                    </div>
                    <div class="trade-result ${t.type.toLowerCase()}">
                        ${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)}
                    </div>
                `;
                tradesList.appendChild(item);
            });

            const winrate = ((wins / trades.length) * 100).toFixed(0);
            statWinrate.innerText = winrate + '%';
            statNet.innerText = (totalNet >= 0 ? '+' : '') + '$' + totalNet.toFixed(2);
            statNet.style.color = totalNet >= 0 ? 'var(--success)' : 'var(--danger)';
            statTotal.innerText = trades.length;
        }
    </script>
</body>
</html>
