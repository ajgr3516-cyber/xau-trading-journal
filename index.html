<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA XAULIQUIDITY - Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: #131b28;
            --border-color: #1e293b;
            --accent-gold: #d4af37;
            --green: #22c55e;
            --red: #ef4444;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            margin: 0;
            padding: 12px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .brand {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .date-badge {
            background: rgba(212, 175, 55, 0.1);
            color: var(--accent-gold);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }
        .card-full {
            grid-column: span 2;
        }
        .card-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .main-stat {
            font-size: 1.8rem;
            font-weight: bold;
            line-height: 1.1;
        }
        .sub-stat {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .winrate-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .circle-chart {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: conic-gradient(var(--green) 0% 0%, #1e293b 0% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        .circle-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .edit-panel {
            background: var(--card-bg);
            border: 1px dashed var(--accent-gold);
            border-radius: 12px;
            padding: 14px;
            margin-top: 15px;
        }
        .edit-panel h3 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: var(--accent-gold);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }
        .form-group input {
            background: #0b0f17;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .btn-calc {
            width: 100%;
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
